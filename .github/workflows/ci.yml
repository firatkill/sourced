name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'
  LLM_MODE: mock
  IP_HASH_SALT: ci-ip-salt-0000000000000000000000000000
  QUESTION_HASH_SALT: ci-question-salt-000000000000000000000
  NEXT_PUBLIC_SITE_URL: http://localhost:3100
  DEMO_MODE: 'on'

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check:corpus-literals
      - run: pnpm audit --prod --audit-level high

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  integration:
    name: Integration tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: sourced
          POSTGRES_PASSWORD: sourced
          POSTGRES_DB: sourced_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U sourced -d sourced_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://sourced:sourced@localhost:5433/sourced_test
      TEST_DATABASE_URL: postgres://sourced:sourced@localhost:5433/sourced_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm test:contract
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  e2e:
    name: E2E (mock provider)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: sourced
          POSTGRES_PASSWORD: sourced
          POSTGRES_DB: sourced
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U sourced -d sourced"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://sourced:sourced@localhost:5433/sourced
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm exec tsx --conditions=react-server tests/fixtures/kit-tr/setup.ts
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  docker:
    name: Docker-only smoke (mock provider)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: sourced-docker-ci
    steps:
      - uses: actions/checkout@v7
      - name: Configure image user
        run: echo "SOURCED_UID=$(id -u)" >> "$GITHUB_ENV"
      - run: docker compose build app cli
      - run: docker compose up -d --wait db
      - run: ./sourced init --example --profile local --yes --json
      - name: Require actionable missing-key error
        run: |
          set +e
          ./sourced ingest --offline --yes --json > /tmp/sourced-missing.json
          status=$?
          set -e
          test "$status" -eq 2
          jq -e '.error.code == "CONFIG_INVALID" and (.error.message | contains("OPENAI_API_KEY"))' /tmp/sourced-missing.json
      - run: printf '\nLLM_MODE=mock\n' >> .env.local
      - run: ./sourced ingest --offline --yes --json
      - run: ./sourced dev
      - run: curl --fail http://localhost:3000/api/health
      - name: Require runtime corpus copy
        run: curl --fail http://localhost:3000/ | grep -F 'Ask the PostgreSQL docs.'
      - name: Require a cited answer
        run: |
          ./sourced ask "When should I use a partial index?" --json > /tmp/sourced-answer.json
          jq -e '.ok == true and .result.outcome == "answered" and (.result.citations | length > 0)' /tmp/sourced-answer.json
      - name: Change runtime copy without rebuilding
        run: |
          before=$(docker compose images -q app)
          sed -i 's/Ask the PostgreSQL docs./Ask the runtime docs./' sourced.config.ts
          docker compose run --rm -T cli config:snapshot --json
          docker compose restart app
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/ > /tmp/sourced-page.html && grep -qF 'Ask the runtime docs.' /tmp/sourced-page.html; then break; fi
            sleep 1
          done
          grep -qF 'Ask the runtime docs.' /tmp/sourced-page.html
          test "$before" = "$(docker compose images -q app)"
      - name: Stop without deleting data
        if: always()
        run: ./sourced down
