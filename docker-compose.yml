services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: sourced
      POSTGRES_PASSWORD: sourced
      POSTGRES_DB: sourced
    ports:
      - '127.0.0.1:${SOURCED_DB_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sourced -d sourced']
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build:
      context: .
      args:
        UID: '${SOURCED_UID:-1000}'
    command: app
    # Resolve lazily so the standalone Node-path db service needs no env file.
    # The app entrypoint and launchers enforce initialization before app/CLI use.
    env_file:
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: postgres://sourced:sourced@db:5432/sourced
      MIGRATION_DATABASE_URL: postgres://sourced:sourced@db:5432/sourced
      SOURCED_LAUNCHER: '${SOURCED_LAUNCHER:-./sourced}'
      OLLAMA_BASE_URL: '${OLLAMA_BASE_URL:-http://host.docker.internal:11434}'
      DOCLING_URL: http://docling:5001
    ports: ['127.0.0.1:${SOURCED_PORT:-3000}:3000']
    volumes: ['.:/workspace']
    working_dir: /workspace
    extra_hosts: ['host.docker.internal:host-gateway']
    depends_on:
      db:
        condition: service_healthy
  cli:
    build:
      context: .
      args:
        UID: '${SOURCED_UID:-1000}'
    profiles: [cli]
    entrypoint: ['/app/scripts/docker-entrypoint.sh', 'cli']
    # Resolve lazily so the standalone Node-path db service needs no env file.
    # The app entrypoint and launchers enforce initialization before app/CLI use.
    env_file:
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: postgres://sourced:sourced@db:5432/sourced
      MIGRATION_DATABASE_URL: postgres://sourced:sourced@db:5432/sourced
      SOURCED_DOCKER: '1'
      SOURCED_LAUNCHER: '${SOURCED_LAUNCHER:-./sourced}'
      SOURCED_PORT: '${SOURCED_PORT:-3000}'
      OLLAMA_BASE_URL: '${OLLAMA_BASE_URL:-http://host.docker.internal:11434}'
      DOCLING_URL: http://docling:5001
    volumes: ['.:/workspace']
    working_dir: /workspace
    extra_hosts: ['host.docker.internal:host-gateway']
    depends_on:
      db:
        condition: service_healthy
  # D-152: optional document reader, started only by `./sourced docling on` (or by `dev`
  # when the library uses it). Documents reach it inside this machine and go nowhere else.
  docling:
    image: quay.io/docling-project/docling-serve-cpu:v1.38.2
    profiles: [docling]
    restart: unless-stopped
    environment:
      DOCLING_SERVE_ENABLE_UI: 'false'
      DOCLING_SERVE_ENG_LOC_NUM_WORKERS: '1'
    ports: ['127.0.0.1:${SOURCED_DOCLING_PORT:-5001}:5001']
volumes:
  pgdata:
